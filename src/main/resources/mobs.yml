# Nightmare mob tiers. With Vystorm Core 0.44.0+ the drops of each tier are the Core loot table
# vystorminsomnia:mobs/tier_<id> (same chances, rolled through category:mob_drop_common).
# Mob loot rule: what drops is the tier list, how good only the tier level (loot_level, default 15 per tier id;
# Core config loot.mob-level-luck: 0.05 luck per level). The player's luck does not count.
tiers:
  '1':
    min_fatigue: 70.0
    entities: [ZOMBIE, SPIDER]
    health_multiplier: 0.85
    damage_multiplier: 1.0
    # Core loot table or category id (Vystorm Core 0.44.0+); empty = category:mob_drop_common with the drops below.
    loot_table: ''
    drops:
      membrane:
        material: PHANTOM_MEMBRANE
        chance: 0.18
        min: 1
        max: 1
  '2':
    min_fatigue: 82.0
    entities: [HUSK, CAVE_SPIDER, PHANTOM]
    health_multiplier: 1.10
    damage_multiplier: 1.15
    # Core loot table or category id (Vystorm Core 0.44.0+); empty = category:mob_drop_common with the drops below.
    loot_table: ''
    drops:
      membrane:
        material: PHANTOM_MEMBRANE
        chance: 0.30
        min: 1
        max: 2
      eye:
        material: SPIDER_EYE
        chance: 0.16
        min: 1
        max: 1
  '3':
    min_fatigue: 94.0
    entities: [HUSK, PHANTOM, VINDICATOR]
    health_multiplier: 1.35
    damage_multiplier: 1.30
    # Core loot table or category id (Vystorm Core 0.44.0+); empty = category:mob_drop_common with the drops below.
    loot_table: ''
    drops:
      membrane:
        material: PHANTOM_MEMBRANE
        chance: 0.45
        min: 1
        max: 3
      echo:
        material: ECHO_SHARD
        chance: 0.08
        min: 1
        max: 1
