# Server settings (Settings → Server → Fatigue & sleep): setting.<config path>.label|desc
debt_reminder:
  message: '&6Your sleep debt is {debt}%. Coffee and campfires cannot reduce it. Sleep in a bed to recover. Reminders can be disabled in /vsettings → Sleep.'
  preference: 'Sleep debt reminders'
  preference_desc: 'Remind me to sleep when my sleep debt is high'

setting:
  debt_reminder:
    enabled:
      label: 'Sleep debt reminders'
      desc: 'Send reminders to awake players with high sleep debt'
    threshold:
      label: 'Sleep debt threshold'
      desc: 'Minimum sleep debt percentage for a reminder'
    interval_minutes:
      label: 'Reminder interval (minutes)'
      desc: 'Minimum time between reminders for each player during this session'
  fatigue:
    enabled:
      label: 'Fatigue rises'
      desc: 'Off = fatigue and sleep debt no longer grow'
    base_per_minute:
      label: 'Fatigue per minute'
      desc: 'Increase at normal activity (0.125 ≈ 160 min per stage)'
    debt_per_minute:
      label: 'Sleep debt per minute'
      desc: 'Increase of sleep debt'
    pause-afk:
      enabled:
        label: "Pause while idle"
        desc: "Fatigue stops rising for players without input"
    exclude_creative:
      label: "Pause in Creative"
      desc: "Fatigue does not rise in Creative mode"
    exclude_spectator:
      label: "Pause in Spectator"
      desc: "Fatigue does not rise in Spectator mode"
  sleep:
    fatigue_recovery_per_second:
      label: 'Recovery in sleep /s'
      desc: 'Fatigue reduction per second of sleep'
    debt_recovery_per_second:
      label: 'Debt reduction in sleep /s'
      desc: 'Sleep debt reduction per second of sleep'
    cancel_vanilla_night_skip:
      label: 'Prevent vanilla night skip'
      desc: 'Sleeping does not skip the night'
    dialog:
      enabled:
        label: 'Sleep dialog'
        desc: 'Ask sleepers: sleep until a time, dream realm or get up'
      day_naps:
        label: 'Dialog for day naps'
        desc: 'Also ask on daytime naps (only while the dream realm is open)'
      custom_time:
        label: 'Own wake-up time'
        desc: 'Offer an hour picker in the sleep dialog'
    wake_summary:
      label: 'Wake-up summary'
      desc: 'Getting up early shows how long you slept and what it took away'
    acceleration:
      enabled:
        label: 'Time acceleration'
        desc: 'Time runs faster the more players sleep, instead of skipping the night'
      min_speed:
        label: 'Speed with few sleepers'
        desc: 'Times faster with the first of several sleepers (1-100)'
      max_speed:
        label: 'Speed with everyone asleep'
        desc: 'Times faster when everyone sleeps (1-100); 10 ≈ one minute per night'
      curve:
        label: 'Speed curve'
        desc: '1 = linear, 2 = slow until most sleep, 0.5 = fast early'
      action_bar:
        label: 'Action bar'
        desc: 'Show sleepers and speed to everyone in the world'
    enabled:
      label: "Sleep"
      desc: "Real-time sleep in beds; off = beds work as in vanilla"
    quality:
      enabled:
        label: "Sleep quality"
        desc: "Roof, light, monsters and weather change how well players sleep"
      cozy:
        enabled:
          label: "Cozy bedrooms"
          desc: "Furnishings around the bed improve sleep"
    daytime:
      enabled:
        label: "Daytime naps"
        desc: "Players can nap in a bed by day"
  stimulants:
    enabled:
      label: 'Stimulants'
      desc: 'Caffeine and the like suppress fatigue'
  hallucinations:
    enabled:
      label: 'Hallucinations'
      desc: 'Sounds and visual disturbances when very tired'
    chance_exhausted:
      label: 'Hallucination: exhausted'
