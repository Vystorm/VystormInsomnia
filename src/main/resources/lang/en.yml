# /insomnia, /dream, /wake and /dreamloot through Vystorm Core 0.45.0+: description, help and tab completion per player.
# "aliases" under commands.<command> are extra root commands (server-wide, the admin chooses which languages: Core config
# commands.localized-aliases); "name" and "aliases" of a subcommand are accepted in every language, English always works.
commands:
  insomnia:
    description: "Fatigue and sleep: menu, status, history, triggers and administration"
    aliases: []
    sub:
      menu:
        name: menu
        aliases: []
        description: "Open the fatigue menu"
      status:
        name: status
        aliases: []
        description: "Your fatigue, sleep debt, stage and rested bonus"
      history:
        name: history
        aliases: []
        description: "Your latest fatigue samples and sleep events"
      triggers:
        name: triggers
        aliases: []
        description: "Your latest hallucinations and what triggered them"
      admin:
        name: admin
        aliases: []
        description: "Administration: values, sleep, effects, mobs, overview and reload"
        sub:
          get:
            name: get
            aliases: []
            description: "Show a player's fatigue status"
            usage: "PLAYER"
            args:
              player: PLAYER
          setfatigue:
            name: setfatigue
            aliases: []
            description: "Set a player's fatigue (+n/-n changes it)"
            usage: "PLAYER 0-100|+n|-n"
            args:
              player: PLAYER
              value: "0-100|+n|-n"
          setdebt:
            name: setdebt
