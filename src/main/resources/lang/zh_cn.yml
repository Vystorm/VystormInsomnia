# 通过 Vystorm Core 0.45.0+ 提供的 /insomnia、/dream、/wake 和 /dreamloot：每位玩家看到自己语言的说明、帮助和 Tab 补全。
# commands.<命令> 下的 "aliases" 是额外的主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；
# 子命令的 "name" 和 "aliases" 在所有语言中都可使用，英文始终有效。
commands:
  insomnia:
    description: "疲劳与睡眠：菜单、状态、记录、触发和管理"
    aliases: [失眠]
    sub:
      menu:
        name: 菜单
        aliases: []
        description: "打开疲劳菜单"
      status:
        name: 状态
        aliases: []
        description: "你的疲劳、睡眠债、阶段和休息加成"
      history:
        name: 记录
        aliases: [历史]
        description: "你最近的疲劳数据和睡眠事件"
      triggers:
        name: 触发
        aliases: []
        description: "你最近的幻觉及其触发原因"
      admin:
        name: 管理
        aliases: []
        description: "管理：数值、睡眠、效果、怪物、总览和重载"
        sub:
          get:
            name: 查询
            aliases: []
            description: "显示玩家的疲劳状态"
            usage: "玩家"
            args:
              player: 玩家
          setfatigue:
            name: 设疲劳
            aliases: []
            description: "设置玩家的疲劳值（+n/-n 为增减）"
            usage: "玩家 0-100|+n|-n"
            args:
              player: 玩家
              value: "0-100|+n|-n"
          setdebt:
            name: 设睡眠债
            aliases: []
            description: "设置玩家的睡眠债（+n/-n 为增减）"
            usage: "玩家 0-100|+n|-n"
            args:
              player: 玩家
              value: "0-100|+n|-n"
          sleep:
            name: 休息
            aliases: []
            description: "让玩家立即完成休息"
            usage: "玩家"
            args:
              player: 玩家
          effect:
            name: 效果
            aliases: []
            description: "为玩家触发一个幻觉（不填名称：列出所有效果）"
            usage: "玩家 [效果]"
            args:
              player: 玩家
              value: 效果
          spawnmob:
            name: 生成怪物
            aliases: []
            description: "在玩家附近生成指定等级的失眠怪物"
            usage: "玩家 等级"
            args:
              player: 玩家
              value: 等级
          reload:
            name: 重载
            aliases: []
            description: "检查并重新加载配置"
          overview:
            name: 总览
            aliases: []
            description: "所有在线玩家的疲劳总览"
  dream:
    description: "从附近安全的床进入梦境"
    aliases: [入梦]
    sub:
      quest:
        name: "任务"
        aliases: []
        description: "继续持久保存的分支梦境故事"
        args:
          action: "选择"
      invite:
        name: "邀请"
        aliases: []
        description: "邀请另一位做梦者进入你的梦境"
        args:
          player: "PLAYER"
      join:
        name: "加入"
        aliases: []
        description: "加入你受邀的梦境"
        args:
          player: "PLAYER"
      leave:
        name: "离开"
        aliases: []
        description: "离开共享梦境"
      weekly:
        name: "每周"
        aliases: []
        description: "本周梦魇挑战及最快通关"

    values:
      status: "状态"
      start: "开始"
      pause: "暂停"
      mercy: "仁慈"
      courage: "勇气"
      restore: "修复"
      master: "掌控"

  wake:
    description: "安全离开梦境"
    aliases: [醒来]
  dreamloot:
    description: "领取你保存的梦境奖励"
    aliases: [梦境奖励]

