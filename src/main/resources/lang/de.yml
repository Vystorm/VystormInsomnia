# /insomnia, /dream, /wake und /dreamloot über Vystorm Core 0.45.0+: Beschreibung, Hilfe und Tab-Vervollständigung je
# Spieler. "aliases" unter commands.<befehl> sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen:
# Core-Konfig commands.localized-aliases); "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden,
# Englisch geht immer.
commands:
  insomnia:
    description: "Müdigkeit und Schlaf: Menü, Status, Verlauf, Auslöser und Verwaltung"
    aliases: [schlaflos]
    sub:
      menu:
        name: menü
        aliases: [menue]
        description: "Das Müdigkeits-Menü öffnen"
      status:
        name: status
        aliases: []
        description: "Deine Müdigkeit, Schlafschuld, Stufe und dein Ausgeruht-Bonus"
      history:
        name: verlauf
        aliases: []
        description: "Deine letzten Müdigkeitswerte und Schlafereignisse"
      triggers:
        name: auslöser
        aliases: [ausloeser]
        description: "Deine letzten Halluzinationen und was sie ausgelöst hat"
      admin:
        name: admin
        aliases: [verwaltung]
        description: "Verwaltung: Werte, Schlaf, Effekte, Mobs, Übersicht und neu laden"
        sub:
          get:
            name: abfragen
            aliases: []
            description: "Den Müdigkeitsstatus eines Spielers zeigen"
            usage: "SPIELER"
            args:
              player: SPIELER
          setfatigue:
            name: müdigkeit
            aliases: [muedigkeit]
            description: "Die Müdigkeit eines Spielers setzen (+n/-n ändert sie)"
            usage: "SPIELER 0-100|+n|-n"
            args:
              player: SPIELER
              value: "0-100|+n|-n"
          setdebt:
            name: schlafschuld
            aliases: []
            description: "Die Schlafschuld eines Spielers setzen (+n/-n ändert sie)"
            usage: "SPIELER 0-100|+n|-n"
            args:
              player: SPIELER
              value: "0-100|+n|-n"
          sleep:
            name: ausruhen
            aliases: []
            description: "Einen Spieler sofort ausruhen lassen"
            usage: "SPIELER"
            args:
              player: SPIELER
          effect:
            name: effekt
            aliases: []
            description: "Eine Halluzination für einen Spieler auslösen (ohne Namen: Effekte auflisten)"
            usage: "SPIELER [EFFEKT]"
            args:
              player: SPIELER
              value: EFFEKT
          spawnmob:
            name: mob
            aliases: []
            description: "Einen Insomnia-Mob einer Stufe bei einem Spieler erscheinen lassen"
            usage: "SPIELER STUFE"
            args:
              player: SPIELER
              value: STUFE
          reload:
            name: neuladen
            aliases: []
            description: "Konfiguration prüfen und neu laden"
          overview:
            name: übersicht
            aliases: [uebersicht]
            description: "Müdigkeits-Übersicht aller Spieler online"
  dream:
    description: "Von einem sicheren Bett in der Nähe die Traumweite betreten"
    aliases: [traumreise]
    sub:
      quest:
        name: "quest"
        aliases: []
        description: "Deiner gespeicherten verzweigten Traumgeschichte folgen"
        args:
          action: "AUSWAHL"
      invite:
        name: "einladen"
        aliases: []
        description: "Einen anderen Träumer in deinen Traum einladen"
        args:
          player: "PLAYER"
      join:
        name: "beitreten"
        aliases: []
        description: "Einem Traum beitreten, zu dem du eingeladen wurdest"
        args:
          player: "PLAYER"
      leave:
        name: "verlassen"
        aliases: []
        description: "Den geteilten Traum verlassen"
      weekly:
        name: "woche"
        aliases: []
        description: "Die Albtraum-Herausforderung der Woche und ihre schnellsten Zeiten"

    values:
      status: "status"
      start: "start"
      pause: "pause"
      mercy: "gnade"
      courage: "mut"
      restore: "heilen"
      master: "meistern"

  wake:
    description: "Die Traumweite sicher verlassen"
    aliases: [aufwachen]
  dreamloot:
    description: "Deine gespeicherten Traum-Belohnungen abholen"
    aliases: [traumbeute]

