# Русский — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
title: Усталость и сон
permission: insomnia.use
pages:
- title: Усталость и долги сна
  text: |
    1. Пока вы бодрствуете, усталость и долги сна медленно растут; напряженные действия ускоряют это.
    2. В меню Vystorm (/vmenu) Под "характером" → "Усталость" (also /insomnia) Вы видите свое состояние, усталость, долги за сон и бонус от отдыха.
    3. Этапы: отдохнувшие, усталые, истощенные, переутомленные, лишение сна. Каждое изменение этапа отправляет сообщение с кнопкой в статус.
- title: Хорошо спать
  text: |
    1. Лежи в кровати. Сначала вы засыпаете, затем следует глубокий сон, который восстанавливается больше всего.
    2. Кровать под крышей и в темноте восстанавливается лучше всего; в городах и арендованных участках вы лучше спите.
    3. Если вы проснулись полностью отдохнувшим, вы получите отдохнувший бонус на некоторое время.
- title: Стимуляторы
  text: |
    1. Кофеин и тому подобное подавляют усталость на некоторое время.
    2. Каждое использование перед следующим сном повышает вашу толерантность и ослабляет эффект.
    3. Когда эффект изнашивается, следует крах усталости.
- title: Отдых у костра
  text: |
    1. Снаружи и около без кровати? Встаньте на несколько секунд рядом с зажженным костром или костром души.
    2. Затем ваша усталость медленно падает, но только до предела (30 % по умолчанию). Бар действий показывает прогресс.
    3. Переезд или драка завершают все остальное. Долг за сон и отдохнувший бонус все еще нуждаются в кровати.
- title: слишком долго бодрствовать
  text: |
    1. Из «Измученных» на вас играют трюки звуки и визуальные нарушения.
    2. Когда вы очень устали, вы рискуете микросном: вы ненадолго киваете, и ваше тело остается уязвимым.
    3. Кошмарные монстры появляются только для вас и нападают только на вас. Спите, пока не зашло так далеко.
- title: Администрация
  permission: insomnia.admin
  text: |
    1. Настройки сервера: Настройки → сервер → Усталость и сон; немедленное сохранение нагрузки.
    2. /insomnia admin overview (или кнопка «Все игроки» в меню «Усталость» или клик + правый клик игрока) перечисляет каждого игрока с быстрыми действиями.
    3. командование: /insomnia admin get|setfatigue|setdebt|sleep|effect|spawnmob <player> и /insomnia admin reload.
    4. Тексты живут в plugins/VystormInsomnia/lang/de.yml и en.yml.
