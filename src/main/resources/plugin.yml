name: VystormInsomnia
version: '${version}'
main: at.vystorm.insomnia.VystormInsomniaPlugin
api-version: '1.20.6'
load: POSTWORLD
depend:
  - vystorm_core
softdepend:
  - VystormCityClaim
  - BloodMoon
  - floodgate
permissions:
  insomnia.*:
    description: Alle Insomnia-Rechte
    default: op
    children:
      insomnia.admin: true
      insomnia.use: true
      insomnia.dream: true
      insomnia.dream.quest: true
  insomnia.use:
    description: /insomnia (Menü, Status, Verlauf, Auslöser) und Müdigkeits-Anzeige
    default: true
  insomnia.admin:
    description: /insomnia admin (Werte setzen, Schlaf, Effekte, Mobs, Reload) und Insomnia-Servereinstellungen
    default: op
    children:
      insomnia.use: true
  insomnia.dream:
    description: Enter dreams, wake safely and claim dream rewards
    default: true
  insomnia.dream.quest:
    description: Follow the branching dream campaign and collect its ending reward
    default: true
